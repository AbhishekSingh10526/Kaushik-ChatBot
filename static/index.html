<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kaushik AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", sans-serif;
}

body {
    background: #0f0f0f;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Card */
.card {
    width: 95%;
    max-width: 520px;
    background: #1a1a1a;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 0 40px rgba(0,0,0,0.9);
    display: flex;
    flex-direction: column;
}

/* Auth */
#authCard {
    text-align: center;
}

h2 {
    color: #4CAF50;
    margin-bottom: 15px;
}

/* Inputs */
input {
    width: 100%;
    padding: 16px;
    margin: 12px 0;
    border-radius: 14px;
    border: 1px solid #333;
    background: #222;
    color: #ffffff;   /* FIXED TEXT COLOR */
    font-size: 16px;
}

input::placeholder {
    color: #888;
}

input:focus {
    outline: none;
    border: 1px solid #4CAF50;
}

/* Buttons */
button {
    padding: 12px 18px;
    border-radius: 12px;
    border: none;
    background: #4CAF50;
    color: white;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s ease;
}

button:hover {
    background: #43a047;
}

/* Chat */
.chat-container {
    display: none;
    height: 85vh;
}

/* Header */
.header {
    text-align: center;
    margin-bottom: 10px;
}

.user-id-display {
    font-size: 13px;
    color: #4CAF50;
    margin-top: 4px;
}

/* Messages */
.messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 5px;
    display: flex;
    flex-direction: column;
}

.message {
    padding: 12px 16px;
    margin: 6px 0;
    border-radius: 16px;
    max-width: 75%;
    font-size: 15px;
    line-height: 1.4;
}

.user {
    background: #2e2e2e;
    align-self: flex-end;
    color: white;
}

.ai {
    background: #4CAF50;
    align-self: flex-start;
    color: white;
}

/* Input Row */
.row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

#msg {
    flex: 1;
    padding: 16px;
    border-radius: 16px;
    background: #222;
    border: 1px solid #333;
    color: #ffffff;   /* FIXED */
    font-size: 16px;
}

/* Send button small and clean */
.row button {
    width: auto;
    padding: 12px 18px;
}

/* Logout */
.logout {
    background: crimson;
    margin-top: 10px;
}

.logout:hover {
    background: #b71c1c;
}

/* Mobile */
@media (max-width: 480px) {
    .card {
        height: 100vh;
        border-radius: 0;
        max-width: 100%;
    }
}
</style>
</head>

<body>

<!-- AUTH -->
<div class="card" id="authCard">

    <h2 id="authTitle">Login</h2>

    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />

    <button id="authBtn" onclick="submitAuth()">Login</button>

    <p style="margin-top:10px; color:#aaa;">
        New user?
        <span id="authToggle" style="color:#4CAF50;cursor:pointer;" onclick="toggleAuth()">Register</span>
    </p>

</div>

<!-- CHAT -->
<div class="card chat-container" id="chatCard">

    <div class="header">
        <h2>Kaushik AI</h2>
        <div class="user-id-display" id="userDisplay"></div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="row">
        <input type="text" id="msg" placeholder="Type your message..." />
        <button onclick="send()">Send</button>
    </div>

    <button class="logout" onclick="logout()">Logout</button>

</div>

<script>
let isRegister = false;
let token = localStorage.getItem("gc_token");
let currentUser = localStorage.getItem("gc_user");

function toggleAuth() {
    isRegister = !isRegister;
    authTitle.innerText = isRegister ? "Register" : "Login";
    authBtn.innerText = isRegister ? "Register" : "Login";
    authToggle.innerText = isRegister ? "Login" : "Register";
}

async function submitAuth() {
    const user = username.value.trim();
    const pass = password.value;
    if (!user || !pass) return alert("Fill all fields");

    try {
        const res = await fetch(isRegister ? "/register" : "/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: user, password: pass })
        });
        if (!res.ok) return alert((await res.text()).trim());

        if (isRegister) {
            alert("Registered! Now login.");
            return toggleAuth();
        }
        const data = await res.json();
        token = data.token;
        currentUser = data.username;
        localStorage.setItem("gc_token", token);
        localStorage.setItem("gc_user", currentUser);
        showChat();
    } catch (e) {
        alert("Server not reachable. Wait a minute and try again.");
    }
}

function showChat() {
    userDisplay.innerText = "Logged in as: " + currentUser;
    authCard.style.display = "none";
    chatCard.style.display = "flex";
}

function showAuth() {
    chatCard.style.display = "none";
    authCard.style.display = "block";
    messages.innerHTML = "";
    password.value = "";
}

async function logout() {
    try {
        await fetch("/logout", { method: "POST", headers: { Authorization: "Bearer " + token } });
    } catch (e) {}
    token = null;
    currentUser = null;
    localStorage.removeItem("gc_token");
    localStorage.removeItem("gc_user");
    showAuth();
}

function add(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.style.whiteSpace = "pre-wrap";
    div.innerText = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
}

async function send() {
    const message = msg.value.trim();
    if (!message) return;

    add(message, "user");
    msg.value = "";
    const bubble = add("...", "ai");
    let started = false;

    try {
        const res = await fetch("/chat/stream", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
            body: JSON.stringify({ message: message })
        });
        if (res.status === 401) {
            alert("Session expired. Please login again.");
            return logout();
        }
        if (!res.ok) {
            bubble.innerText = "Error: " + (await res.text()).trim();
            return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });

            let i;
            while ((i = buf.indexOf("\n\n")) >= 0) {
                const block = buf.slice(0, i);
                buf = buf.slice(i + 2);
                let event = "message", data = "";
                for (const line of block.split("\n")) {
                    if (line.startsWith("event: ")) event = line.slice(7);
                    else if (line.startsWith("data: ")) data += line.slice(6);
                }
                if (!data) continue;
                const payload = JSON.parse(data);
                if (event === "error") {
                    bubble.innerText += "\n[Error: " + payload.error + "]";
                } else if (payload.token) {
                    if (!started) { bubble.innerText = ""; started = true; }
                    bubble.innerText += payload.token;
                    messages.scrollTop = messages.scrollHeight;
                }
            }
        }
    } catch (e) {
        bubble.innerText = "Connection error. Please try again.";
    }
}

document.getElementById("msg").addEventListener("keypress", function (e) {
    if (e.key === "Enter") send();
});

if (token && currentUser) showChat();
</script>

</body>
</html>
